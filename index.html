<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal portfolio of Krish Kanaujiya, a BCA student who likes anime, manga, and games." />
    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" sizes="any" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Krish" />
    <link rel="manifest" href="/favicon/site.webmanifest" />
    <title>Krish</title>
    <link
      rel="preload"
      href="/BrassMono/BrassMono-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <script>
      // Apply the saved theme before paint to avoid a flash.
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark") {
            theme = saved;
          } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
            theme = "dark";
          }
        } catch (error) {
          theme = "light";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <header class="site-header container">
      <button
        id="theme-toggle"
        class="theme-toggle"
        type="button"
        aria-label="Switch to dark theme"
        title="Switch to dark theme"
      >
        <img
          class="theme-icon theme-icon--sun"
          src="/icons/sun.svg"
          alt=""
          width="20"
          height="20"
        />
        <img
          class="theme-icon theme-icon--moon"
          src="/icons/moon.svg"
          alt=""
          width="20"
          height="20"
        />
      </button>
    </header>

    <main class="site-main container">
      <img
        class="avatar"
        src="/favicon/favicon.svg"
        alt="A glowing lantern beneath a starry night sky"
        width="200"
        height="200"
      />

      <p class="hello">Hello, my name is</p>
      <h1>Krish Kanaujiya</h1>
      <p class="subtitle">BCA student</p>

      <p class="about">
        I am currently studying for my Bachelor of Computer Applications. Outside
        of classes, I spend my time watching anime, reading manga, and playing
        games.
      </p>

      <section class="likes" aria-labelledby="likes-title">
        <h2 id="likes-title" class="section-title">Things I like</h2>
        <ul class="like-list">
          <li>Anime</li>
          <li>Manga</li>
          <li>Games</li>
        </ul>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; <span id="year">2026</span> Krish Kanaujiya</p>
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
